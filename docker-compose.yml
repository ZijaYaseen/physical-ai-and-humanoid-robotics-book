services:
  backend:
    build: ./backend_python
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend_python:/app
      - ./logs:/app/logs
      - ./docs:/app/docs
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
